# Raspberry Pi 5用のWaylandコンポジタ設定例
# UIとWaydroidを同じSwayセッションで動かし、WindowAdapterが座標を設定する。

default_border pixel 0
default_floating_border pixel 0
focus_follows_mouse no
mouse_warping none

for_window [app_id="l880k-car-navigation"] floating enable
for_window [app_id="l880k-car-navigation"] move position 0 px 0 px
for_window [app_id="l880k-car-navigation"] resize set 1280 px 720 px
for_window [app_id="waydroid"] floating enable
for_window [class="Waydroid"] floating enable
